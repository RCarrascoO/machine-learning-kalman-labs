[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorio3-sistemas"
version = "1.0.0"
description = "Laboratorio #3 INF0157 - Clustering, Regression, Signal Filtering & Visualization"
authors = [
    {name = "Renato Carrasco", email = "renato.carrasco@estudiante.cl"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "pytest>=7.0.0",
    "seaborn>=0.11.0",
]
